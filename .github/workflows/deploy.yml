name: Deploy API to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_PATH: /opt/chariot-api/chariot
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'DEPLOY_SCRIPT'
            set -e
            echo "🚀 Starting deployment..."
            cd $DEPLOY_PATH
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Build image
            echo "🐳 Building Docker image..."
            sudo docker build -f apps/api/Dockerfile -t chariot-api:latest .
            
            # Restart containers
            echo "♻️  Restarting containers..."
            sudo docker-compose -f apps/api/docker-compose.yml down
            sudo docker-compose -f apps/api/docker-compose.yml up -d
            
            # Wait and health check
            echo "⏳ Waiting for app to start..."
            sleep 60
            
            if curl -f http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed"
              sudo docker-compose -f apps/api/docker-compose.yml logs api --tail=50
              exit 1
            fi
          DEPLOY_SCRIPT

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi